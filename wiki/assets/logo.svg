<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="limbo-c++ logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0066ff"/>
      <stop offset="1" stop-color="#00ffff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#1e1e1e"/>
  <rect x="4" y="4" width="56" height="56" rx="9" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <!-- server stack: three bars, echoing the "limbo" void holding pattern -->
  <g fill="url(#g)">
    <rect x="15" y="18" width="34" height="6" rx="3"/>
    <rect x="15" y="29" width="34" height="6" rx="3" opacity="0.72"/>
    <rect x="15" y="40" width="34" height="6" rx="3" opacity="0.44"/>
  </g>
  <!-- cursor / void baseline -->
  <circle cx="49" cy="43" r="3.5" fill="#00ffff"/>
</svg>
