# =============================================================================
# limbo-c++ server properties — easy configuration
# Lines starting with '#' are comments. Format: key=value (no spaces needed).
# Unknown keys and bad values are NOT silent: the server logs a WARN at startup
# and keeps running with the default. Secrets are never printed (set/unset only).
# After editing, restart the server. Start with: ./build/limbo --config config/limbo.properties
# =============================================================================

# --- 1. Network ---------------------------------------------------------------
# bind: which interface to listen on. "0.0.0.0" = all IPv4+IPv6 (dual-stack).
# Use "127.0.0.1" for local-only testing.
bind=0.0.0.0
# port: TCP port players connect to (1-65565). Default 25566 (25565 is vanilla).
port=25566
# max_players: slots shown in the server list and enforced at login.
# Status pings never use a slot; only real logins count.
max_players=100

# --- 2. Server list (what players see before joining) --------------------------
version_name=Limbo-C++
motd=Limbo-C++ void
# protocol_max: INFORMATIONAL only (shown nowhere critical). Real version
# acceptance uses the built-in tables + allowed_versions below.
protocol_max=777

# --- 3. Who may join ------------------------------------------------------------
# allowed_versions: comma-separated PVNs, ranges and labels ("all" widens).
# Supported scope is 1.18 + 1.18.1 (both PVN 757); other clients get a clean
# "Unsupported Minecraft version" reject. Set to "all" to accept everything
# the tables know (best-effort, unverified outside 1.18.x).
# Examples:
#   allowed_versions=1.18, 1.18.1
#   allowed_versions=all
#   allowed_versions=1.8.x, 340, 759-762, 767
# Labels: 1.8.x 1.12 1.12.1 1.12.2 1.13 1.13.1 1.13.2 1.14 1.14.1 1.14.2 1.14.3
# 1.14.4 1.15 1.15.1 1.15.2 1.16 1.16.1 1.16.2 1.16.3 1.16.4 1.16.5 1.17 1.17.1
# 1.18 1.18.2 1.19 1.19.2 1.19.3 1.19.4 1.20 1.20.2 1.20.3 1.20.5 1.21 1.21.2
# 1.21.4 1.21.5 1.21.6 1.21.7 1.21.9 1.21.11 26.1 26.2 26.3
# Rejected clients get "Unsupported Minecraft version" and a [reject] log line.
allowed_versions=1.18, 1.18.1

# --- 4. Velocity forwarding (behind a Velocity proxy) -----------------------------
# forwarding: NONE = direct joins (cracked/offline OK). MODERN = require
# Velocity modern forwarding (needs forwarding_secret, 1.13+ only).
forwarding=NONE
# forwarding_secret: MUST equal velocity.toml forwarding-secret when MODERN.
# Leave empty with NONE. Never logged.
forwarding_secret=

# --- 5. Timeouts & limits ---------------------------------------------------------
# read_timeout_ms: how long to wait for login/config packets (30s default).
read_timeout_ms=30000
# max_packet_bytes: largest single packet accepted (flood guard, 8KB default).
max_packet_bytes=8192

# --- 6. Player freeze ------------------------------------------------------------------
# freeze-player: when true (DEFAULT), any position-carrying packet snaps the
# player back to spawn with a fresh teleport (frozen limbo). Teleport
# confirms are accepted silently. When false, movement is ignored and
# clients can walk away (walkable void).
freeze-player=false

# --- 7. Spawn point ---------------------------------------------------------------------
# Where players appear and (with freeze-player=true) are pinned.
# spawn_x / spawn_z: block centers, default 8.5 / 8.5 (middle of chunk 0,0).
# spawn_y: empty (or "auto", DEFAULT) = feet exactly on the platform top when
#   a schematic is loaded, else 400.0 over the void. Set a number to force it.
#   Note: with a custom X/Z off the platform, auto-Y leaves you floating.
spawn_x=8.5
spawn_y=
spawn_z=8.5
# chunk_radius: manual chunk load, half-extent around the spawn chunk (0..4,
#   DEFAULT 1 = 3x3). The login burst always includes every chunk the
#   schematic touches (auto-detected corner blocks) plus the spawn chunk;
#   raising this loads a wider area. 0 = schematic footprint + spawn only.

# --- 8. Logging ---------------------------------------------------------------------
# debug_level: how much the console logs. One of: error | info | debug | trace
#   error = only failures ([reject], send failures)
#   info  = + joins/leaves with reason and session time (DEFAULT, recommended)
#   debug = + handshakes, LoginAck, Registry/Tags/Packs/Finish stages
#   trace = + every ignored serverbound packet (very noisy)
# The old debug_log=true still works and means debug_level=debug.
debug_level=info
# debug_log: legacy alias (false). Only used when debug_level is unset.
debug_log=false

# --- 9. World: spawn schematic ------------------------------------------------------
# schematics/ folder (next to the repo root, also found beside the binary):
#   schematics/spawn.schem  <- shipped default: 8x3x8 stone floor + glass pillars
# To use your own lobby/spawn:
#   1. Export from WorldEdit: select region, //schem save <name>  (Sponge v2)
#   2. Copy the file:  cp <name>.schem schematics/
#   3. Point at it:    schematic_path=schematics/<name>.schem
#   4. Restart the server.
# Rules: Sponge v2, max 256 per side, max ~1M blocks. Renders on 1.18+ clients
# (older get void); any load error = void fallback, never a crash.
# Empty = pure void world.
schematic_path=schematics/spawn.schem

# --- Log lines you'll see ---------------------------------------------------------
# [login] user=MOB ... pvn=775 (26.1) skin=default   -> accepted, skin or default
# [leave] user=MOB ... stage=play after=42s online=0  -> why they left + time
# [reject] user=... reason: unsupported version      -> version not allowed
# [config] user=... no finish-ack (...)               -> client rejected our
#    Registry/Tags/Packs (check version support) or closed early
